<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100907" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Warattah, groupe de metal tribal originaire de Nouméa. Musique brute, racines profondes — démo Distorsion (2006), album Hatred & Strength (XIIIbis Records / Warner Music, 2012)."
    />
    <title>Warattah — Metal tribal, Nouvelle-Calédonie</title>

    <!-- Open Graph / Twitter Card : doivent rester statiques ici, les
         crawlers de partage social n'exécutent en général pas le JS de
         la page (contrairement à Googlebot). Contenu par défaut en
         français, la langue affichée à l'écran étant choisie côté
         client après ce premier rendu. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://warattah.com/" />
    <meta property="og:title" content="Warattah — Metal tribal, Nouvelle-Calédonie" />
    <meta
      property="og:description"
      content="Warattah, groupe de metal tribal originaire de Nouméa. Musique brute, racines profondes — démo Distorsion (2006), album Hatred & Strength (XIIIbis Records / Warner Music, 2012)."
    />
    <meta property="og:image" content="https://warattah.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Warattah — Metal tribal, Nouvelle-Calédonie" />
    <meta
      name="twitter:description"
      content="Warattah, groupe de metal tribal originaire de Nouméa. Musique brute, racines profondes."
    />
    <meta name="twitter:image" content="https://warattah.com/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicGroup",
        "name": "Warattah",
        "genre": "Tribal Metal",
        "foundingDate": "2006",
        "foundingLocation": {
          "@type": "Place",
          "name": "Nouméa, Nouvelle-Calédonie"
        },
        "url": "https://warattah.com/",
        "sameAs": ["https://warattah.bandcamp.com/music"]
      }
    </script>
    <script type="text/javascript">
      // Restaure la vraie URL après le redirect encodé par public/404.html
      // (technique standard "spa-github-pages" — nécessaire car GitHub
      // Pages est un hébergeur statique sans réécriture serveur pour
      // BrowserRouter).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Piedra&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
