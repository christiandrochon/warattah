<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Warattah</title>
    <script type="text/javascript">
      // GitHub Pages ne fait aucune réécriture serveur pour un routeur
      // React côté client (BrowserRouter) : toute URL qui n'est pas un
      // fichier réel (ex: /contact) atterrit ici. On encode le chemin
      // demandé dans le query string et on redirige vers index.html, qui
      // le restaure ensuite via history.replaceState (voir index.html).
      // Technique standard "spa-github-pages".
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
